services:
  db:
    image: pgvector/pgvector:0.8.5-pg16   # 0.8.5 latest; ≥0.8.2 floor for CVE-2026-3172
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # host 6380 to avoid clashing with a local redis on 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://finance:finance@db:5432/finance
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      SEED_ON_START: "1"
      CORS_ORIGINS: "http://localhost:3000"
      LLM_MODEL: "google/gemini-3.6-flash"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"   # supply via shell/.env; empty is fine until you use /chat
    volumes:
      - ./docs_sample:/app/docs_sample:ro             # corpus for `python -m app.chat.ingest`
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: "http://localhost:8000"
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
